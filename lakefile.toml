name = "Tessera"
defaultTargets = ["Tessera"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "crossterm-lean-ffi"
git = "https://github.com/katzenpost/crossterm-lean-ffi"
rev = "8488514aa9de05ed5d59506b2df25b7bdfa26b44"

[[require]]
name = "LeanBench"
git = "https://github.com/alok/LeanBench"
rev = "250d2a892bf8c91ec3ae5de8517793e18379f97b"

[[lean_lib]]
name = "Tessera"

[[lean_lib]]
name = "Demo"
srcDir = "examples"

[[lean_exe]]
name = "tessera-test"
root = "Tessera.Tests.Main"

[[lean_exe]]
name = "tessera-demo"
root = "Demo"
srcDir = "examples"

[[lean_exe]]
name = "tessera-vterm"
root = "Tessera.Tests.VTerm"

[[lean_exe]]
name = "tessera-bench"
root = "Tessera.Bench.Main"
